server:
  port: 8080

spring:
  application:
    name: fashion-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fashion?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:fashion}
    password: ${DB_PASSWORD:fashion_change_me}
  jpa:
    hibernate:
      ddl-auto: update   # dev only; đổi sang Flyway khi schema ổn định
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-string-at-least-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health
